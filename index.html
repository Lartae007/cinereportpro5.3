<!DOCTYPE html>
<html lang="en" class="bg-black text-gray-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cine Report Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            overscroll-behavior-y: none;
        }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        /* Mobile Scrollbars */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        
        .arri-input {
            background: #111; border: 1px solid #333; color: #fff;
            padding: 0.5rem; border-radius: 6px;
            font-family: 'Roboto Mono', monospace;
            text-align: center; outline: none; transition: border-color 0.2s;
        }
        .arri-input:focus { border-color: #dc2626; }
        
        .arri-panel {
            background: #0a0a0c; border: 1px solid #1f1f22;
            border-radius: 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .btn-press { transition: transform 0.1s, background-color 0.2s, border-color 0.2s; }
        .btn-press:active { transform: scale(0.95); }

        /* Status Toggles */
        .status-toggle { border: 2px solid #222; transition: all 0.2s; }
        .status-toggle.active-print { background: #064e3b; border-color: #10b981; color: #34d399; }
        .status-toggle.active-hold { background: #422006; border-color: #d97706; color: #fcd34d; }
        .status-toggle.active-ng { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }
        .status-toggle.active-fs { background: #450a0a; border-color: #f97316; color: #fdba74; }

        @keyframes flashScreen {
            0% { background-color: rgba(220, 38, 38, 0.5); }
            100% { background-color: transparent; }
        }
        .flash-active { animation: flashScreen 0.4s ease-out; }
        .modal-overlay { background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-sm">

    <div id="flashOverlay" class="fixed inset-0 pointer-events-none z-[100]"></div>

    <!-- APP HEADER -->
    <header class="bg-black border-b border-zinc-800 p-3 shrink-0 flex justify-between items-center z-20">
        <div class="flex items-center gap-2 flex-1">
            <i class="fa-solid fa-video text-red-600 text-xl"></i>
            <input type="text" id="project-name" value="PROJECT NAME" class="bg-transparent text-white font-black text-base sm:text-lg tracking-widest outline-none w-full uppercase placeholder-zinc-700">
        </div>
        <div class="flex items-center gap-2 bg-zinc-950 px-2 py-1 rounded border border-zinc-800 shrink-0">
            <div id="master-tc" class="font-mono text-base sm:text-lg font-bold text-red-500 tracking-widest">00:00:00:00</div>
            <select id="fps-select" class="bg-zinc-900 border border-zinc-700 text-white rounded px-1 py-0.5 text-[10px] font-bold outline-none ml-1">
                <option value="24">24</option>
                <option value="25">25</option>
                <option value="30">30</option>
            </select>
        </div>
    </header>

    <!-- MAIN APP NAVIGATION -->
    <div class="flex border-b border-zinc-800 bg-[#111] shrink-0 sticky top-0 z-20">
        <button id="btn-tab-action" onclick="switchMainTab('tab-action')" class="flex-1 py-3 text-xs font-bold border-b-2 border-red-500 text-red-500 uppercase tracking-widest transition-colors">Slate</button>
        <button id="btn-tab-camera" onclick="switchMainTab('tab-camera')" class="flex-1 py-3 text-xs font-bold border-b-2 border-transparent text-zinc-500 uppercase tracking-widest transition-colors">Camera</button>
        <button id="btn-tab-sound" onclick="switchMainTab('tab-sound')" class="flex-1 py-3 text-xs font-bold border-b-2 border-transparent text-zinc-500 uppercase tracking-widest transition-colors">Sound</button>
        <button id="btn-tab-logs" onclick="switchMainTab('tab-logs')" class="flex-1 py-3 text-xs font-bold border-b-2 border-transparent text-zinc-500 uppercase tracking-widest transition-colors">Logs</button>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 overflow-y-auto bg-[#050505] relative">
        
        <!-- TAB 1: SLATE ACTION -->
        <div id="tab-action" class="p-4 flex flex-col gap-4">
            
            <!-- Scene & Shot -->
            <div class="grid grid-cols-2 gap-4">
                <div class="arri-panel p-3 flex flex-col items-center shadow-lg">
                    <label class="text-[10px] uppercase text-zinc-500 font-bold tracking-widest mb-2">Scene</label>
                    <div class="flex items-center gap-1 w-full">
                        <button onclick="updateScene(-1)" class="w-10 h-14 bg-zinc-800 hover:bg-zinc-700 rounded-lg font-bold text-xl btn-press">-</button>
                        <input type="text" id="val-scene" value="1" onclick="openModal('sceneModal')" readonly class="flex-1 h-14 text-2xl font-bold text-center bg-zinc-900 border border-zinc-700 rounded-lg cursor-pointer w-full px-1">
                        <button onclick="updateScene(1)" class="w-10 h-14 bg-zinc-800 hover:bg-zinc-700 rounded-lg font-bold text-xl btn-press">+</button>
                    </div>
                </div>
                
                <div class="arri-panel p-3 flex flex-col items-center shadow-lg">
                    <label class="text-[10px] uppercase text-zinc-500 font-bold tracking-widest mb-2">Shot</label>
                    <div class="flex items-center gap-1 w-full mb-2">
                        <button onclick="updateShot(-1)" class="w-10 h-14 bg-zinc-800 hover:bg-zinc-700 rounded-lg font-bold text-xl btn-press">-</button>
                        <input type="text" id="val-shot" value="A" onclick="openModal('shotModal')" readonly class="flex-1 h-14 text-2xl font-bold text-center text-amber-500 bg-zinc-900 border border-zinc-700 rounded-lg cursor-pointer w-full px-1">
                        <button onclick="updateShot(1)" class="w-10 h-14 bg-zinc-800 hover:bg-zinc-700 rounded-lg font-bold text-xl btn-press">+</button>
                    </div>
                    <button onclick="toggleShotMode()" id="shotModeBtn" class="w-full bg-zinc-800 hover:bg-zinc-700 py-1.5 rounded text-[9px] font-bold text-zinc-300 uppercase tracking-widest btn-press">Mode: Letter</button>
                </div>
            </div>

            <!-- Prefix & Take -->
            <div class="grid grid-cols-2 gap-4">
                <div class="arri-panel p-3 flex flex-col items-center shadow-lg">
                    <label class="text-[10px] uppercase text-zinc-500 font-bold tracking-widest mb-2">Prefix</label>
                    <button onclick="cyclePrefix()" id="val-prefix" class="w-full h-14 bg-zinc-900 border border-zinc-700 rounded-lg text-2xl font-bold text-zinc-300 btn-press">-</button>
                </div>
                
                <div class="arri-panel p-3 flex flex-col items-center shadow-lg border-red-900/30">
                    <label class="text-[10px] uppercase text-red-500 font-bold tracking-widest mb-2">Take</label>
                    <div class="flex items-center gap-1 w-full">
                        <button onclick="updateTake(-1)" class="w-10 h-14 bg-zinc-800 hover:bg-zinc-700 rounded-lg font-bold text-xl text-zinc-300 btn-press">-</button>
                        <input type="number" id="val-take" value="1" class="flex-1 h-14 text-3xl font-black font-mono text-center text-red-500 bg-black border border-red-900/50 rounded-lg w-full px-1 outline-none focus:border-red-500">
                        <button onclick="updateTake(1)" class="w-10 h-14 bg-zinc-800 hover:bg-zinc-700 rounded-lg font-bold text-xl text-zinc-300 btn-press">+</button>
                    </div>
                </div>
            </div>

            <!-- Status Toggles -->
            <div class="arri-panel p-3 shadow-lg mt-1">
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setStatus('PRINT', this)" class="status-toggle bg-zinc-900 py-3 rounded-lg btn-press flex flex-col items-center gap-1 border border-zinc-800">
                        <i class="fa-solid fa-circle-check text-green-500 text-xl"></i>
                        <span class="font-bold text-white uppercase text-[9px] mt-1">Print</span>
                    </button>
                    <button onclick="setStatus('HOLD', this)" class="status-toggle bg-zinc-900 py-3 rounded-lg btn-press flex flex-col items-center gap-1 border border-zinc-800">
                        <i class="fa-solid fa-pause text-amber-500 text-xl"></i>
                        <span class="font-bold text-white uppercase text-[9px] mt-1">Hold</span>
                    </button>
                    <button onclick="setStatus('NG', this)" class="status-toggle bg-zinc-900 py-3 rounded-lg btn-press flex flex-col items-center gap-1 border border-zinc-800">
                        <i class="fa-solid fa-xmark text-red-500 text-xl"></i>
                        <span class="font-bold text-white uppercase text-[9px] mt-1">NG</span>
                    </button>
                    <button onclick="setStatus('FS', this)" class="status-toggle bg-zinc-900 py-3 rounded-lg btn-press flex flex-col items-center gap-1 border border-zinc-800">
                        <i class="fa-solid fa-rotate-left text-orange-500 text-xl"></i>
                        <span class="font-bold text-white uppercase text-[9px] mt-1">F.Start</span>
                    </button>
                </div>
            </div>

            <!-- Massive LOG Button -->
            <button onclick="logTake()" class="w-full bg-red-700 hover:bg-red-600 active:bg-red-800 text-white rounded-xl border border-red-500 btn-press flex flex-col items-center justify-center shadow-[0_0_30px_rgba(220,38,38,0.4)] py-6 mt-2 mb-4">
                <span class="text-3xl font-black tracking-widest drop-shadow-md">+ LOG TAKE</span>
                <span class="text-[10px] font-bold text-red-200 uppercase tracking-widest mt-1 opacity-80">Capture TC In/Out</span>
            </button>
        </div>

        <!-- TAB 2: CAMERA DEPT -->
        <div id="tab-camera" class="hidden p-4 flex flex-col gap-4">
            <div class="arri-panel p-4 flex flex-col gap-4">
                <div>
                    <label class="text-[10px] uppercase text-zinc-500 font-bold tracking-widest mb-1 block">Cam Media Card (Roll)</label>
                    <input type="text" id="cam-roll" value="A001" class="arri-input text-xl font-black w-full text-center">
                </div>
                
                <div class="h-px bg-zinc-800 w-full"></div>

                <div class="flex flex-col gap-2">
                    <label class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest block">Lens Setup (Generate Lens Kit)</label>
                    <div class="flex gap-2">
                        <input type="text" id="lensSetupInput" placeholder="e.g. 18, 25, 35, 50, 85" class="bg-zinc-900 border border-zinc-700 text-white rounded px-3 py-2 text-sm flex-1 outline-none focus:border-red-500">
                        <button onclick="generateLensButtons()" class="bg-zinc-700 hover:bg-zinc-600 px-4 py-2 rounded text-xs font-bold btn-press">Generate</button>
                    </div>
                </div>

                <div class="flex flex-col gap-2 mt-2">
                    <label class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest flex justify-between items-center">
                        Active Lens
                        <button onclick="clearLensButtons()" class="text-red-500 text-xs" title="Clear Lenses"><i class="fa-solid fa-trash"></i> Clear</button>
                    </label>
                    <div id="lensButtonsContainer" class="flex flex-wrap gap-2 items-center bg-zinc-900/50 p-2 rounded-lg border border-zinc-800 min-h-[50px]">
                        <span class="text-xs text-zinc-600 italic">Generate lenses above...</span>
                    </div>
                    <input type="hidden" id="activeLens" value="-">
                </div>

                <div class="grid grid-cols-2 gap-3 mt-2">
                    <div><label class="text-[9px] text-zinc-500 uppercase block mb-1 font-bold tracking-widest">T-Stop</label><input type="text" id="camTStop" value="T2.8" class="arri-input text-sm w-full py-2"></div>
                    <div><label class="text-[9px] text-zinc-500 uppercase block mb-1 font-bold tracking-widest">ISO</label><input type="text" id="camISO" value="800" class="arri-input text-sm w-full py-2"></div>
                    <div><label class="text-[9px] text-zinc-500 uppercase block mb-1 font-bold tracking-widest">WB / Tint</label><input type="text" id="camWB" value="5600K" class="arri-input text-sm w-full py-2"></div>
                    <div>
                        <label class="text-[9px] text-zinc-500 uppercase block mb-1 font-bold tracking-widest">ND Filter</label>
                        <div class="flex items-center gap-1 w-full bg-[#111] border border-[#333] rounded overflow-hidden h-[34px]">
                            <button onclick="updateND(-1)" class="w-8 h-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 btn-press font-bold">-</button>
                            <input type="text" id="camND" value="Clear" readonly class="bg-transparent text-white font-mono text-xs text-center flex-1 outline-none pointer-events-none">
                            <button onclick="updateND(1)" class="w-8 h-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 btn-press font-bold">+</button>
                        </div>
                    </div>
                    <div class="col-span-2">
                        <label class="text-[9px] text-zinc-500 uppercase block mb-1 font-bold tracking-widest">Color Space</label>
                        <select id="camColor" class="arri-input text-xs w-full py-2 px-2 bg-[#111] outline-none">
                            <option value="LogC4" selected>ARRI LogC4</option>
                            <option value="LogC3">ARRI LogC3</option>
                            <option value="Log3G10">RED Log3G10</option>
                            <option value="S-Log3">Sony S-Log3</option>
                            <option value="C-Log3">Canon C-Log3</option>
                            <option value="ACES">ACES</option>
                            <option value="Rec709">Rec709</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 3: SOUND DEPT -->
        <div id="tab-sound" class="hidden p-4 flex flex-col gap-4">
            <div class="arri-panel p-4 flex flex-col gap-4">
                <div>
                    <label class="text-[10px] uppercase text-zinc-500 font-bold tracking-widest mb-1 block">Sound Roll</label>
                    <input type="text" id="snd-roll" value="SR001" class="arri-input text-xl font-black w-full text-center">
                </div>

                <div class="h-px bg-zinc-800 w-full"></div>

                <div class="grid grid-cols-2 gap-3">
                    <div><label class="text-[9px] text-zinc-500 uppercase block mb-1 font-bold tracking-widest">Sample Rate</label>
                        <select id="sndRate" class="arri-input text-sm py-2 w-full"><option>48kHz</option><option>96kHz</option></select>
                    </div>
                    <div><label class="text-[9px] text-zinc-500 uppercase block mb-1 font-bold tracking-widest">Bit Depth</label>
                        <select id="sndBit" class="arri-input text-sm py-2 w-full"><option>24-bit</option><option>32-bit Float</option></select>
                    </div>
                </div>

                <div class="flex flex-col gap-2 mt-2">
                    <label class="text-[9px] text-zinc-500 uppercase block mb-1 font-bold tracking-widest">Flags</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="toggleFlag(this, 'MOS')" class="snd-flag bg-zinc-800 py-2 text-[10px] rounded-lg border border-zinc-700 font-bold btn-press">MOS</button>
                        <button onclick="toggleFlag(this, 'WILD')" class="snd-flag bg-zinc-800 py-2 text-[10px] rounded-lg border border-zinc-700 font-bold btn-press">WILD TRK</button>
                        <button onclick="toggleFlag(this, 'TONE')" class="snd-flag bg-zinc-800 py-2 text-[10px] rounded-lg border border-zinc-700 font-bold btn-press">ROOM TONE</button>
                    </div>
                </div>

                <div class="mt-2">
                    <label class="text-[9px] text-zinc-500 uppercase block mb-2 font-bold tracking-widest">iXML 4-Track Layout</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="tr1" placeholder="Ch1" value="MixL" class="arri-input text-xs py-2 text-center">
                        <input type="text" id="tr2" placeholder="Ch2" value="MixR" class="arri-input text-xs py-2 text-center">
                        <input type="text" id="tr3" placeholder="Ch3" value="Boom1" class="arri-input text-xs py-2 text-center">
                        <input type="text" id="tr4" placeholder="Ch4" class="arri-input text-xs py-2 text-center">
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 4: LOGS & CREW -->
        <div id="tab-logs" class="hidden flex flex-col min-h-full">
            
            <!-- Crew Setup -->
            <div class="p-4 border-b border-zinc-800 bg-[#0a0a0c]">
                <h2 class="text-xs font-bold text-zinc-300 uppercase tracking-widest mb-3"><i class="fa-solid fa-users mr-2"></i>Crew & Shoot Setup</h2>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <div class="flex items-center gap-2"><span class="text-[9px] text-zinc-500 font-bold uppercase w-10">Date</span><input type="date" id="shoot-date" class="bg-zinc-900 border border-zinc-700 text-zinc-300 rounded px-2 py-1.5 text-xs w-full outline-none focus:border-red-500"></div>
                    <div class="flex items-center gap-2"><span class="text-[9px] text-zinc-500 font-bold uppercase w-10">Day</span><input type="text" id="shoot-day" placeholder="1" class="bg-zinc-900 border border-zinc-700 text-zinc-300 rounded px-2 py-1.5 text-xs w-full text-center outline-none focus:border-red-500"></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="flex items-center gap-2"><span class="text-[9px] text-zinc-500 font-bold uppercase w-10">PROD</span><input type="text" id="producer-name" class="bg-zinc-900 border border-zinc-700 text-white rounded px-2 py-1.5 text-[10px] w-full outline-none focus:border-red-500"></div>
                    <div class="flex items-center gap-2"><span class="text-[9px] text-zinc-500 font-bold uppercase w-10">DIR</span><input type="text" id="director-name" class="bg-zinc-900 border border-zinc-700 text-white rounded px-2 py-1.5 text-[10px] w-full outline-none focus:border-red-500"></div>
                    <div class="flex items-center gap-2"><span class="text-[9px] text-zinc-500 font-bold uppercase w-10">DOP</span><input type="text" id="dop-name" class="bg-zinc-900 border border-zinc-700 text-white rounded px-2 py-1.5 text-[10px] w-full outline-none focus:border-red-500"></div>
                    <div class="flex items-center gap-2"><span class="text-[9px] text-zinc-500 font-bold uppercase w-10">SOUND</span><input type="text" id="sound-name" class="bg-zinc-900 border border-zinc-700 text-white rounded px-2 py-1.5 text-[10px] w-full outline-none focus:border-red-500"></div>
                </div>
            </div>

            <!-- Table Actions -->
            <div class="flex justify-between items-center p-3 bg-[#111] border-b border-zinc-800 shrink-0">
                <h2 class="text-xs font-bold text-zinc-300 uppercase tracking-widest">Master Log Table</h2>
                <div class="flex gap-2">
                    <button onclick="alertBox('CSV Export ready')" class="bg-blue-900/50 hover:bg-blue-800/50 text-blue-400 px-3 py-1 rounded text-[10px] font-bold tracking-widest border border-blue-900 uppercase btn-press"><i class="fa-solid fa-file-csv"></i> CSV</button>
                    <button onclick="alertBox('ALE Export ready')" class="bg-purple-900/50 hover:bg-purple-800/50 text-purple-400 px-3 py-1 rounded text-[10px] font-bold tracking-widest border border-purple-900 uppercase btn-press"><i class="fa-solid fa-file-code"></i> ALE</button>
                    <button onclick="alertBox('PDF Export ready')" class="bg-red-900/50 hover:bg-red-800/50 text-red-400 px-3 py-1 rounded text-[10px] font-bold tracking-widest border border-red-900 uppercase btn-press"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                </div>
            </div>
            
            <!-- Log Table Container (Scrolls horizontally & vertically) -->
            <div class="flex-1 overflow-auto bg-[#0a0a0c]">
                <table class="w-full text-left text-xs whitespace-nowrap min-w-[800px]">
                    <thead class="bg-zinc-900 text-zinc-400 sticky top-0 z-10 shadow-md">
                        <tr>
                            <th class="p-2 border-b border-r border-zinc-800 font-bold uppercase tracking-widest text-[9px] w-8">#</th>
                            <th class="p-2 border-b border-r border-zinc-800 font-bold uppercase tracking-widest text-[9px] text-center w-12">Prefix</th>
                            <th class="p-2 border-b border-r border-zinc-800 font-bold uppercase tracking-widest text-[9px]">Scene</th>
                            <th class="p-2 border-b border-r border-zinc-800 font-bold uppercase tracking-widest text-[9px]">Shot</th>
                            <th class="p-2 border-b border-r border-zinc-800 font-bold uppercase tracking-widest text-[9px] text-center">Take</th>
                            <th class="p-2 border-b border-r border-zinc-800 font-bold uppercase tracking-widest text-[9px] text-center">Status</th>
                            <th class="p-2 border-b border-r border-zinc-800 font-bold uppercase tracking-widest text-[9px]">TC In</th>
                            <th class="p-2 border-b border-r border-zinc-800 font-bold uppercase tracking-widest text-[9px]">TC Out</th>
                            <th class="p-2 border-b border-r border-zinc-800 font-bold uppercase tracking-widest text-[9px]">Cam/Lens</th>
                            <th class="p-2 border-b border-r border-zinc-800 font-bold uppercase tracking-widest text-[9px]">Snd Roll</th>
                            <th class="p-2 border-b border-r border-zinc-800 font-bold uppercase tracking-widest text-[9px] w-64">Notes</th>
                            <th class="p-2 border-b border-zinc-800 font-bold uppercase tracking-widest text-[9px] text-center w-10">Del</th>
                        </tr>
                    </thead>
                    <tbody id="logBody" class="text-zinc-300 font-mono text-[11px]">
                        <!-- Rows inserted here -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- SCENE MODAL -->
    <div id="sceneModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4">
        <div class="bg-[#121212] border border-zinc-700 rounded-xl w-full max-w-[360px] overflow-hidden shadow-2xl flex flex-col">
            <div class="p-4 bg-black border-b border-zinc-800 flex justify-between items-center">
                <h3 class="font-bold text-white uppercase tracking-widest text-xs">Set Scene</h3>
                <button onclick="closeModal('sceneModal')" class="text-zinc-500 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="flex border-b border-zinc-800 bg-black">
                <button onclick="switchModalTab('scene', 'setup')" id="sceneTabSetup" class="flex-1 py-3 text-xs font-bold border-b-2 border-red-500 text-red-500 uppercase tracking-widest transition-colors">Setup</button>
                <button onclick="switchModalTab('scene', 'custom')" id="sceneTabCustom" class="flex-1 py-3 text-xs font-bold text-zinc-500 border-b-2 border-transparent uppercase tracking-widest transition-colors">Custom</button>
            </div>

            <div id="sceneContentSetup" class="p-4 space-y-4 flex-1">
                <div class="grid grid-cols-5 gap-2">
                    <script>
                        for(let i=1; i<=10; i++) document.write(`<button onclick="appendModalValue('scene', '${i}')" class="bg-zinc-800 hover:bg-zinc-700 py-3 rounded-lg text-sm font-bold btn-press">${i}</button>`);
                    </script>
                    <button onclick="appendModalValue('scene', '20')" class="bg-zinc-800 hover:bg-zinc-700 py-3 rounded-lg text-sm font-bold btn-press">20</button>
                    <button onclick="appendModalValue('scene', '30')" class="bg-zinc-800 hover:bg-zinc-700 py-3 rounded-lg text-sm font-bold btn-press">30</button>
                    <button onclick="appendModalValue('scene', '40')" class="bg-zinc-800 hover:bg-zinc-700 py-3 rounded-lg text-sm font-bold btn-press">40</button>
                    <button onclick="appendModalValue('scene', '50')" class="bg-zinc-800 hover:bg-zinc-700 py-3 rounded-lg text-sm font-bold btn-press">50</button>
                    <button onclick="appendModalValue('scene', '60')" class="bg-zinc-800 hover:bg-zinc-700 py-3 rounded-lg text-sm font-bold btn-press">60</button>
                </div>
                <div class="pt-2 border-t border-zinc-800">
                    <input type="text" id="sceneSetupPreview" class="w-full bg-black text-center text-xl py-3 font-bold font-mono text-white border border-zinc-800 rounded-lg outline-none" placeholder="Preview">
                </div>
                <button onclick="confirmModal('scene', 'setup')" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-lg uppercase tracking-widest text-xs btn-press">Apply Setup</button>
            </div>

            <div id="sceneContentCustom" class="p-5 hidden space-y-4 flex-1">
                <label class="text-[9px] font-bold tracking-widest text-zinc-500 uppercase block mb-1">Type Custom Scene Name</label>
                <input type="text" id="sceneCustomInput" class="w-full bg-black border border-zinc-700 rounded-lg text-2xl text-center py-4 font-bold focus:border-red-500 text-white outline-none" placeholder="e.g. 14A PT2">
                <button onclick="confirmModal('scene', 'custom')" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold tracking-widest text-xs py-4 rounded-lg mt-4 btn-press uppercase">Save Custom</button>
            </div>
        </div>
    </div>

    <!-- SHOT MODAL -->
    <div id="shotModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4">
        <div class="bg-[#121212] border border-zinc-700 rounded-xl w-full max-w-[360px] overflow-hidden shadow-2xl flex flex-col">
            <div class="p-4 bg-black border-b border-zinc-800 flex justify-between items-center">
                <h3 class="font-bold text-white uppercase tracking-widest text-xs">Set Shot</h3>
                <button onclick="closeModal('shotModal')" class="text-zinc-500 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="flex border-b border-zinc-800 bg-black">
                <button onclick="switchModalTab('shot', 'setup')" id="shotTabSetup" class="flex-1 py-3 text-xs font-bold border-b-2 border-red-500 text-red-500 uppercase tracking-widest transition-colors">Setup</button>
                <button onclick="switchModalTab('shot', 'custom')" id="shotTabCustom" class="flex-1 py-3 text-xs font-bold text-zinc-500 border-b-2 border-transparent uppercase tracking-widest transition-colors">Custom</button>
            </div>

            <div id="shotContentSetup" class="p-4 space-y-4 flex-1">
                <div class="grid grid-cols-6 gap-2">
                    <script>
                        const letters = ['A','B','C','D','E','F','G','H','J','K','L','M','N','P','Q','R','S','T','U','V','W','X','Y','Z'];
                        letters.forEach(l => {
                            document.write(`<button onclick="confirmDirectShot('${l}')" class="bg-zinc-800 hover:bg-zinc-700 py-3 rounded-lg border border-zinc-700 text-base font-bold btn-press text-amber-500">${l}</button>`);
                        });
                    </script>
                </div>
            </div>

            <div id="shotContentCustom" class="p-5 hidden space-y-4 flex-1">
                <label class="text-[9px] font-bold tracking-widest text-zinc-500 uppercase block mb-1">Type Custom Shot Name</label>
                <input type="text" id="shotCustomInput" class="w-full bg-black border border-zinc-700 rounded-lg text-2xl text-center py-4 font-bold focus:border-red-500 text-amber-500 uppercase outline-none" placeholder="e.g. A2">
                <button onclick="confirmModal('shot', 'custom')" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold tracking-widest text-xs py-4 rounded-lg mt-4 btn-press uppercase">Save Custom Shot</button>
            </div>
        </div>
    </div>

    <!-- DELETE MODAL -->
    <div id="deleteModal" class="fixed inset-0 modal-overlay hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-[#121212] border border-red-900 rounded-xl w-full max-w-[300px] p-6 shadow-2xl flex flex-col text-center">
            <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-4"></i>
            <h3 class="font-bold text-white text-lg mb-2">Delete Log?</h3>
            <p class="text-zinc-400 text-xs mb-6">Are you sure you want to permanently delete this take?</p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 bg-zinc-800 text-white font-bold py-3 rounded-lg text-xs tracking-widest uppercase btn-press">Cancel</button>
                <button onclick="executeDelete()" class="flex-1 bg-red-700 text-white font-bold py-3 rounded-lg text-xs tracking-widest uppercase btn-press">Delete</button>
            </div>
        </div>
    </div>

    <!-- MESSAGE BOX -->
    <div id="msgBox" class="fixed top-4 left-1/2 -translate-x-1/2 bg-zinc-800 border border-zinc-600 text-white px-6 py-3 rounded-lg shadow-xl z-[70] transition-opacity duration-300 opacity-0 pointer-events-none font-bold tracking-wide text-xs flex items-center gap-2">
        <i class="fa-solid fa-info-circle text-blue-400"></i>
        <span id="msgText">Message</span>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        function alertBox(msg) {
            const box = document.getElementById('msgBox');
            document.getElementById('msgText').innerText = msg;
            box.classList.remove('opacity-0');
            setTimeout(() => { box.classList.add('opacity-0'); }, 3000);
        }

        document.getElementById('shoot-date').valueAsDate = new Date();
        
        // Tab System
        function switchMainTab(tabId) {
            ['tab-action', 'tab-camera', 'tab-sound', 'tab-logs'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                let btn = document.getElementById('btn-' + id);
                btn.classList.remove('text-red-500', 'border-red-500');
                btn.classList.add('text-zinc-500', 'border-transparent');
            });
            document.getElementById(tabId).classList.remove('hidden');
            let activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.remove('text-zinc-500', 'border-transparent');
            activeBtn.classList.add('text-red-500', 'border-red-500');
        }

        let prefixValues = ['-', 'INT', 'EXT', 'I/E'];
        let currentPrefixIndex = 0;
        function cyclePrefix() {
            currentPrefixIndex = (currentPrefixIndex + 1) % prefixValues.length;
            document.getElementById('val-prefix').innerText = prefixValues[currentPrefixIndex];
        }

        function updateScene(change) {
            let val = document.getElementById('val-scene').value;
            let match = val.match(/(\d+)(?!.*\d)/);
            if(match) {
                let num = parseInt(match[0]) + change;
                if(num < 1) num = 1;
                document.getElementById('val-scene').value = val.substring(0, match.index) + num + val.substring(match.index + match[0].length);
            } else if(change > 0) {
                document.getElementById('val-scene').value += '1';
            }
        }

        let shotMode = 'letter';
        function toggleShotMode() {
            shotMode = shotMode === 'letter' ? 'number' : 'letter';
            document.getElementById('shotModeBtn').innerText = `Mode: ${shotMode}`;
            document.getElementById('val-shot').value = shotMode === 'letter' ? 'A' : '1';
        }

        function updateShot(change) {
            let shotVal = document.getElementById('val-shot');
            let val = shotVal.value.toUpperCase();
            
            if (shotMode === 'letter') {
                if(!/^[A-Z]$/.test(val)) val = 'A';
                let code = val.charCodeAt(0) + change;
                if(change > 0) {
                    if (code === 73) code = 74;
                    if (code === 79) code = 80;
                } else {
                    if (code === 73) code = 72;
                    if (code === 79) code = 78;
                }
                if (code >= 65 && code <= 90) shotVal.value = String.fromCharCode(code);
            } else {
                let num = parseInt(val) || 1;
                num += change;
                if (num < 1) num = 1;
                shotVal.value = num;
            }
        }

        function updateTake(change) {
            let num = parseInt(document.getElementById('val-take').value) || 1;
            num += change;
            if(num < 1) num = 1;
            document.getElementById('val-take').value = num;
        }

        let currentFrames = 0;
        function formatTC(totalFrames, fps) {
            let f = totalFrames % fps;
            let s = Math.floor(totalFrames / fps) % 60;
            let m = Math.floor(totalFrames / (fps * 60)) % 60;
            let h = Math.floor(totalFrames / (fps * 3600)) % 24;
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}:${f.toString().padStart(2,'0')}`;
        }
        setInterval(() => {
            currentFrames++;
            let fps = parseInt(document.getElementById('fps-select').value) || 24;
            document.getElementById('master-tc').innerText = formatTC(currentFrames, fps);
        }, 1000 / 24);

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            if(id === 'sceneModal') {
                document.getElementById('sceneSetupPreview').value = document.getElementById('val-scene').value;
                document.getElementById('sceneCustomInput').value = document.getElementById('val-scene').value;
            } else if (id === 'shotModal') {
                document.getElementById('shotCustomInput').value = document.getElementById('val-shot').value;
            }
        }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        
        function switchModalTab(modal, tab) {
            const tabs = ['setup', 'custom'];
            tabs.forEach(t => {
                const isActive = tab === t;
                document.getElementById(`${modal}Tab${t.charAt(0).toUpperCase()+t.slice(1)}`).className = 
                    isActive ? `flex-1 py-3 text-xs font-bold border-b-2 border-red-500 text-red-500 uppercase tracking-widest transition-colors` 
                             : `flex-1 py-3 text-xs font-bold text-zinc-500 border-b-2 border-transparent uppercase tracking-widest transition-colors`;
                document.getElementById(`${modal}Content${t.charAt(0).toUpperCase()+t.slice(1)}`).classList.toggle('hidden', !isActive);
            });
            if(tab === 'custom') document.getElementById(`${modal}CustomInput`).focus();
        }

        function appendModalValue(type, val) {
            if(type === 'scene') document.getElementById('sceneSetupPreview').value += val;
        }

        function confirmModal(modal, tab) {
            if(modal === 'scene') {
                const val = tab === 'setup' ? document.getElementById('sceneSetupPreview').value : document.getElementById('sceneCustomInput').value;
                if(val.trim() !== "") document.getElementById('val-scene').value = val.trim();
            } else if (modal === 'shot') {
                const val = document.getElementById('shotCustomInput').value.trim().toUpperCase();
                if(val !== "") document.getElementById('val-shot').value = val;
            }
            closeModal(`${modal}Modal`);
        }
        function confirmDirectShot(val) {
            document.getElementById('val-shot').value = val;
            closeModal('shotModal');
        }

        let rowToDelete = null;
        function promptDelete(btn) {
            rowToDelete = btn.closest('tr');
            document.getElementById('deleteModal').classList.remove('hidden');
        }
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            rowToDelete = null;
        }
        function executeDelete() {
            if (rowToDelete) rowToDelete.remove();
            closeDeleteModal();
            alertBox("Log entry deleted.");
        }

        function clearLensButtons() {
            document.getElementById('lensButtonsContainer').innerHTML = '<span class="text-xs text-zinc-600 italic">Generate lenses above...</span>';
            document.getElementById('lensSetupInput').value = '';
            document.getElementById('activeLens').value = '-';
        }

        const ndValues = ["Clear", "0.3", "0.6", "0.9", "1.2", "1.5", "1.8", "2.1", "2.4"];
        let currentNdIndex = 0;
        function updateND(change) {
            currentNdIndex += change;
            if(currentNdIndex < 0) currentNdIndex = 0;
            if(currentNdIndex >= ndValues.length) currentNdIndex = ndValues.length - 1;
            document.getElementById('camND').value = ndValues[currentNdIndex];
        }

        function generateLensButtons() {
            const input = document.getElementById('lensSetupInput').value;
            const container = document.getElementById('lensButtonsContainer');
            if(!input) return;
            const lenses = input.split(',').map(s => s.trim()).filter(s => s);
            container.innerHTML = '';
            lenses.forEach((lens, index) => {
                const btn = document.createElement('button');
                btn.innerText = lens.includes('mm') ? lens : lens + 'mm';
                btn.className = `px-4 py-2 rounded-lg text-xs font-bold border btn-press ${index===0 ? 'bg-red-900/50 border-red-500 text-white' : 'bg-zinc-800 border-zinc-700 text-zinc-300'}`;
                if(index === 0) document.getElementById('activeLens').value = btn.innerText;
                btn.onclick = function() {
                    Array.from(container.children).forEach(c => c.className = 'px-4 py-2 rounded-lg text-xs font-bold border btn-press bg-zinc-800 border-zinc-700 text-zinc-300');
                    this.className = 'px-4 py-2 rounded-lg text-xs font-bold border btn-press bg-red-900/50 border-red-500 text-white';
                    document.getElementById('activeLens').value = this.innerText;
                };
                container.appendChild(btn);
            });
        }

        let currentStatus = "None";
        function setStatus(status, btn) {
            document.querySelectorAll('.status-toggle').forEach(b => {
                b.classList.remove('active-print', 'active-hold', 'active-ng', 'active-fs');
                b.style.borderColor = ""; b.style.backgroundColor = "";
            });
            currentStatus = status;
            if(status === 'PRINT') btn.classList.add('active-print');
            if(status === 'HOLD') btn.classList.add('active-hold');
            if(status === 'NG') btn.classList.add('active-ng');
            if(status === 'FS') btn.classList.add('active-fs');
        }

        let sndFlags = [];
        function toggleFlag(btn, flag) {
            if(sndFlags.includes(flag)) {
                sndFlags = sndFlags.filter(f => f !== flag);
                btn.classList.replace('bg-red-900', 'bg-zinc-800');
                btn.classList.replace('border-red-500', 'border-zinc-700');
            } else {
                sndFlags.push(flag);
                btn.classList.replace('bg-zinc-800', 'bg-red-900');
                btn.classList.replace('border-zinc-700', 'border-red-500');
            }
        }

        let logCounter = 1;
        function logTake() {
            const flash = document.getElementById('flashOverlay');
            flash.classList.remove('flash-active');
            void flash.offsetWidth; 
            flash.classList.add('flash-active');

            const prefix = document.getElementById('val-prefix').innerText;
            const scene = document.getElementById('val-scene').value;
            const shot = document.getElementById('val-shot').value;
            const take = document.getElementById('val-take').value;
            let status = currentStatus;
            if(status === 'None') status = '-';
            
            const tcOut = document.getElementById('master-tc').innerText;
            const tcInParts = tcOut.split(':');
            let secIn = parseInt(tcInParts[2]) - 10;
            if(secIn < 0) secIn += 60;
            const tcIn = `${tcInParts[0]}:${tcInParts[1]}:${secIn.toString().padStart(2,'0')}:${tcInParts[3]}`;

            const camRoll = document.getElementById('cam-roll').value;
            const sndRoll = document.getElementById('snd-roll').value;
            const lens = document.getElementById('activeLens').value;
            const tstop = document.getElementById('camTStop').value;
            
            let notes = sndFlags.length > 0 ? `[${sndFlags.join(', ')}] ` : "";

            let badgeClass = "bg-zinc-700 text-zinc-300";
            if(status === 'PRINT') badgeClass = "bg-emerald-900/40 text-emerald-400 border border-emerald-800";
            if(status === 'HOLD') badgeClass = "bg-amber-900/40 text-amber-400 border border-amber-800";
            if(status === 'NG') badgeClass = "bg-red-900/40 text-red-400 border border-red-800";
            if(status === 'FS') badgeClass = "bg-orange-900/40 text-orange-400 border border-orange-800";

            const tr = document.createElement('tr');
            tr.className = "hover:bg-zinc-800/50 border-b border-zinc-800/50 transition-colors";
            tr.innerHTML = `
                <td class="p-2 border-r border-zinc-800/50 text-zinc-600">${logCounter}</td>
                <td class="p-2 border-r border-zinc-800/50 font-bold text-zinc-400 text-center">${prefix !== '-' ? prefix : ''}</td>
                <td class="p-2 border-r border-zinc-800/50 font-bold text-white">${scene}</td>
                <td class="p-2 border-r border-zinc-800/50 text-amber-500 font-bold">${shot}</td>
                <td class="p-2 border-r border-zinc-800/50 text-center font-bold text-base text-red-500">${take}</td>
                <td class="p-2 border-r border-zinc-800/50 text-center">
                    <span class="px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider ${badgeClass}">${status}</span>
                </td>
                <td class="p-2 border-r border-zinc-800/50 text-zinc-500">${tcIn}</td>
                <td class="p-2 border-r border-zinc-800/50 text-white">${tcOut}</td>
                <td class="p-2 border-r border-zinc-800/50 text-zinc-400">${camRoll} / ${lens}</td>
                <td class="p-2 border-r border-zinc-800/50 text-zinc-400">${sndRoll}</td>
                <td class="p-2 border-r border-zinc-800/50">
                    <input type="text" value="${notes}" class="w-full bg-transparent border-b border-transparent focus:border-zinc-500 text-xs px-1 text-zinc-300 outline-none placeholder-zinc-700" placeholder="Notes...">
                </td>
                <td class="p-2 text-center">
                    <button onclick="promptDelete(this)" class="text-zinc-600 hover:text-red-500 transition-colors bg-zinc-900 px-3 py-1 rounded border border-zinc-800">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            `;
            document.getElementById('logBody').prepend(tr);

            updateTake(1);
            logCounter++;
            currentStatus = "None";
            document.querySelectorAll('.status-toggle').forEach(b => {
                b.classList.remove('active-print', 'active-hold', 'active-ng', 'active-fs');
            });
        }
    </script>
</body>
</html>
