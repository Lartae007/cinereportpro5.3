<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Report Pro v1.1</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF & AutoTable Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        @media print {
            body > *:not(#inAppPdfViewer) { display: none !important; }
            #inAppPdfViewer { 
                position: absolute !important; 
                top: 0 !important; 
                left: 0 !important; 
                width: 100% !important; 
                height: auto !important; 
                background: white !important; 
                color: black !important; 
                padding: 0 !important; 
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans pb-12">

    <!-- Header Navigation -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-40 shadow-lg">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-clapperboard text-red-600 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wider text-white">CINE REPORT <span class="text-red-500 text-xs px-2 py-0.5 bg-red-950 border border-red-800 rounded-full">v1.1</span></h1>
            </div>
            <button onclick="clearAllLogs()" class="text-xs bg-gray-800 hover:bg-red-900/40 text-red-400 border border-red-800/40 px-3 py-1.5 rounded transition">
                <i class="fa-solid fa-trash-can mr-1"></i> ล้างข้อมูล
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-6">

        <!-- Project Metadata Form -->
        <section class="bg-gray-900/70 border border-gray-800 rounded-xl p-4 shadow-md">
            <h2 class="text-sm font-semibold text-gray-400 mb-3 uppercase tracking-wider flex items-center">
                <i class="fa-solid fa-film mr-2 text-red-500"></i> ข้อมูลโปรเจกต์ (Project Metadata)
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">ชื่อเรื่อง (Prod Name)</label>
                    <input type="text" id="prodName" value="Cine Project" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">วันที่ถ่าย (Date)</label>
                    <input type="date" id="shootDate" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">คิวที่ (Shoot Day)</label>
                    <input type="text" id="shootDay" value="Day 1" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">ผู้กำกับ (Director)</label>
                    <input type="text" id="director" value="Director" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">ตากล้อง (DoP)</label>
                    <input type="text" id="dop" value="DoP" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">บันทึกเสียง (Sound Mixer)</label>
                    <input type="text" id="sndMixer" value="Sound Mixer" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white focus:border-red-500 outline-none">
                </div>
            </div>
        </section>

        <!-- Log Entry Input Form -->
        <section class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-md space-y-4">
            <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider flex items-center">
                <i class="fa-solid fa-pen-to-square mr-2 text-red-500"></i> บันทึกข้อมูล Take
            </h2>
            
            <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Scene</label>
                    <input type="text" id="scene" value="1" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-center text-white font-bold focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Shot</label>
                    <input type="text" id="shot" value="A" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-center text-amber-400 font-bold focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Take</label>
                    <input type="number" id="take" value="1" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-center text-red-500 font-bold focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Status</label>
                    <select id="status" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white text-xs focus:border-red-500 outline-none">
                        <option value="PRINT/KEEP">PRINT (Keep)</option>
                        <option value="GOOD">GOOD</option>
                        <option value="NO GOOD">NG (No Good)</option>
                        <option value="HOLD">HOLD</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Cam ID & Roll</label>
                    <input type="text" id="camRoll" value="A001" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white text-xs focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Sound Roll</label>
                    <input type="text" id="soundRoll" value="SR001" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white text-xs focus:border-red-500 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Sync Status</label>
                    <input type="text" id="soundSync" value="SYNC" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white text-xs focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Lens / Specs</label>
                    <input type="text" id="lens" value="35mm T2.0" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white text-xs focus:border-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Notes</label>
                    <input type="text" id="notes" placeholder="หมายเหตุเทค..." class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-white text-xs focus:border-red-500 outline-none">
                </div>
            </div>

            <button onclick="handleLogTake()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-lg flex items-center justify-center space-x-2 transition">
                <i class="fa-solid fa-plus-circle"></i>
                <span>บันทึกเทค (LOG TAKE NOW)</span>
            </button>
        </section>

        <!-- Export Action Toolbar -->
        <section class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-md space-y-3">
            <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider flex items-center">
                <i class="fa-solid fa-file-export mr-2 text-red-500"></i> ส่งออกรายงาน (Export Reports)
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <button onclick="exportNetflixPDF('master')" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-3 rounded-lg text-xs flex items-center justify-center space-x-1.5 transition">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>Master PDF</span>
                </button>
                <button onclick="exportNetflixPDF('sound')" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 px-3 rounded-lg text-xs flex items-center justify-center space-x-1.5 transition">
                    <i class="fa-solid fa-file-audio"></i>
                    <span>Sound PDF</span>
                </button>
                <button onclick="exportCSV('master')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-3 rounded-lg text-xs flex items-center justify-center space-x-1.5 transition">
                    <i class="fa-solid fa-file-csv"></i>
                    <span>Master CSV</span>
                </button>
                <button onclick="exportCSV('sound')" class="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 px-3 rounded-lg text-xs flex items-center justify-center space-x-1.5 transition">
                    <i class="fa-solid fa-file-csv"></i>
                    <span>Sound CSV</span>
                </button>
            </div>
        </section>

        <!-- Recorded Take History List -->
        <section class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-md space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider flex items-center">
                    <i class="fa-solid fa-list-check mr-2 text-red-500"></i> รายการ Take ทั้งหมด (<span id="takeCount">0</span>)
                </h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-gray-300">
                    <thead class="bg-gray-950 text-gray-400 uppercase border-b border-gray-800">
                        <tr>
                            <th class="p-2 text-center">#</th>
                            <th class="p-2">Scene</th>
                            <th class="p-2">Shot</th>
                            <th class="p-2 text-center">Take</th>
                            <th class="p-2 text-center">Status</th>
                            <th class="p-2">Cam Roll</th>
                            <th class="p-2">Sound Roll</th>
                            <th class="p-2">Lens</th>
                            <th class="p-2">Notes</th>
                            <th class="p-2 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody" class="divide-y divide-gray-800">
                        <!-- Table rows generated by JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- In-App Viewer Overlay (For Print / Save as PDF on Mobile WebView) -->
    <div id="inAppPdfViewer" class="hidden fixed inset-0 bg-white z-50 overflow-y-auto p-4 text-black">
        <!-- Generated content via showInAppViewer() -->
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Init Storage
        let logsData = JSON.parse(localStorage.getItem('cine_logs_v1.1')) || [];

        document.getElementById('shootDate').valueAsDate = new Date();

        function saveData() {
            localStorage.setItem('cine_logs_v1.1', JSON.stringify(logsData));
            renderLogs();
        }

        function handleLogTake() {
            const scene = document.getElementById('scene').value || '1';
            const shot = document.getElementById('shot').value || 'A';
            const takeInput = document.getElementById('take');
            const take = parseInt(takeInput.value) || 1;
            const status = document.getElementById('status').value;
            const camRoll = document.getElementById('camRoll').value;
            const soundRoll = document.getElementById('soundRoll').value;
            const soundSync = document.getElementById('soundSync').value;
            const lens = document.getElementById('lens').value;
            const notes = document.getElementById('notes').value;

            const newLog = {
                id: Date.now(),
                scene, shot, take, status,
                camRoll, camID: 'A',
                soundRoll, soundSync, lens, notes
            };

            logsData.unshift(newLog); // Newest top
            takeInput.value = take + 1; // Auto increment take
            document.getElementById('notes').value = ''; // Reset note
            saveData();
        }

        function deleteTake(id) {
            logsData = logsData.filter(item => item.id !== id);
            saveData();
        }

        function clearAllLogs() {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการล้างข้อมูล Take ทั้งหมด?')) {
                logsData = [];
                saveData();
            }
        }

        function renderLogs() {
            const tbody = document.getElementById('logsTableBody');
            document.getElementById('takeCount').innerText = logsData.length;

            if (logsData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center py-6 text-gray-500">ยังไม่มีข้อมูล Take บันทึกเข้ามา</td></tr>`;
                return;
            }

            tbody.innerHTML = logsData.map((log, index) => `
                <tr class="hover:bg-gray-800/50 transition">
                    <td class="p-2 text-center font-mono text-gray-500">${logsData.length - index}</td>
                    <td class="p-2 font-bold text-white">${log.scene}</td>
                    <td class="p-2 text-amber-400 font-bold">${log.shot}</td>
                    <td class="p-2 text-center text-red-400 font-bold">${log.take}</td>
                    <td class="p-2 text-center"><span class="px-1.5 py-0.5 rounded text-[10px] ${log.status === 'PRINT/KEEP' || log.status === 'GOOD' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-gray-800 text-gray-400'}">${log.status}</span></td>
                    <td class="p-2">${log.camRoll || '-'}</td>
                    <td class="p-2 font-mono">${log.soundRoll || '-'}</td>
                    <td class="p-2">${log.lens || '-'}</td>
                    <td class="p-2 text-gray-400">${log.notes || '-'}</td>
                    <td class="p-2 text-center">
                        <button onclick="deleteTake(${log.id})" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        // PDF Generation Function
        async function exportNetflixPDF(mode = 'master') {
            if (!logsData || logsData.length === 0) return alert('ไม่มีข้อมูล Take ในโปรเจกต์นี้');

            const prodName = document.getElementById('prodName')?.value || 'Project';
            const date = document.getElementById('shootDate')?.value || '';
            const isSound = mode === 'sound';
            const fileName = `${isSound ? 'Sound_Report' : 'Master_Report'}_${prodName}_${date}.pdf`.replace(/\s+/g, '_');

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape', format: 'a4', unit: 'mm' });

                doc.setFillColor(18, 18, 22);
                doc.rect(0, 0, 297, 18, 'F');
                doc.setTextColor(239, 68, 68);
                doc.setFontSize(14);
                doc.setFont('helvetica', 'bold');
                doc.text(isSound ? "NETFLIX SOUND REPORT" : "NETFLIX MASTER CINE REPORT", 12, 12);
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(8);
                doc.text(`PROD: ${prodName.toUpperCase()}  |  DATE: ${date}`, 200, 12);

                let tableHead = isSound 
                    ? [['#', 'Scene', 'Shot', 'Take', 'Status', 'Cam/Roll', 'Sound', 'Sync', 'Notes']]
                    : [['#', 'Scene', 'Shot', 'Take', 'Status', 'Cam/Roll', 'Sound', 'Sync', 'Lens', 'Notes']];

                let tableBody = logsData.map((log, index) => {
                    const num = logsData.length - index;
                    if (isSound) {
                        return [num, log.scene, log.shot, log.take, log.status || '-', `${log.camRoll || '-'}(${log.camID || 'A'})`, log.soundRoll || '-', log.soundSync || 'SYNC', log.notes || ''];
                    } else {
                        return [num, log.scene, log.shot, log.take, log.status || '-', `${log.camRoll || '-'}(${log.camID || 'A'})`, log.soundRoll || '-', log.soundSync || 'SYNC', `${log.lens || '-'}`, log.notes || ''];
                    }
                });

                doc.autoTable({ startY: 25, head: tableHead, body: tableBody, theme: 'grid', styles: { fontSize: 8 } });

                const pdfBlob = doc.output('blob');
                const file = new File([pdfBlob], fileName, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: fileName });
                    return; 
                } else {
                    throw new Error("Share Blocked");
                }
            } catch (e) {
                // Fallback Mode: Trigger Native Android Print Spooler Viewer
                showInAppViewer(mode, fileName);
            }
        }

        // Native Android Print Spooler Viewer
        function showInAppViewer(mode, fileName) {
            const viewer = document.getElementById('inAppPdfViewer');
            const isSound = mode === 'sound';
            const title = isSound ? "NETFLIX SOUND REPORT" : "NETFLIX MASTER CINE REPORT";
            const prodName = document.getElementById('prodName')?.value || 'Project';

            let tableRowsHtml = logsData.map((log, index) => {
                return `<tr style="border-bottom: 1px solid #ddd; font-size:11px;">
                    <td style="padding:6px; text-align:center;">${logsData.length - index}</td>
                    <td style="padding:6px;">${log.scene}</td>
                    <td style="padding:6px;">${log.shot}</td>
                    <td style="padding:6px; text-align:center; color:red; font-weight:bold;">${log.take}</td>
                    <td style="padding:6px;">${log.camRoll || '-'}(${log.camID || 'A'})</td>
                    <td style="padding:6px;">${log.soundRoll || '-'}</td>
                    <td style="padding:6px;">${log.notes || '-'}</td>
                </tr>`;
            }).join('');

            viewer.innerHTML = `
                <div class="no-print" style="display:flex; justify-content:space-between; margin-bottom:20px; border-bottom:2px solid #eee; padding-bottom:10px;">
                    <button onclick="document.getElementById('inAppPdfViewer').classList.add('hidden')" style="padding:10px 15px; background:#ef4444; color:white; border:none; border-radius:6px; font-weight:bold; font-size:14px;">❌ ปิดหน้าต่าง</button>
                    <button onclick="window.print()" style="padding:10px 15px; background:#2563eb; color:white; border:none; border-radius:6px; font-weight:bold; font-size:14px;">📥 บันทึก PDF (Save)</button>
                </div>
                <div id="printArea" style="font-family:Arial, sans-serif;">
                    <h2 style="color:#ef4444; margin:0; font-size:18px; font-weight:900;">${title}</h2>
                    <div style="font-size:12px; margin-bottom:15px; color:#555;"><b>PROD:</b> ${prodName.toUpperCase()} | <b>TOTAL TAKES:</b> ${logsData.length}</div>
                    <table style="width:100%; border-collapse:collapse; text-align:left;">
                        <tr style="background:#111; color:#fff; font-size:12px;">
                            <th style="padding:6px;">#</th><th style="padding:6px;">Scene</th><th style="padding:6px;">Shot</th>
                            <th style="padding:6px;">Take</th><th style="padding:6px;">Cam</th><th style="padding:6px;">Sound</th><th style="padding:6px;">Notes</th>
                        </tr>
                        ${tableRowsHtml}
                    </table>
                </div>
            `;
            viewer.classList.remove('hidden');
        }

        // CSV Export Function
        function exportCSV(mode = 'master') {
            if (!logsData || logsData.length === 0) return alert('ไม่มีข้อมูล Take ในโปรเจกต์นี้');

            const prodName = document.getElementById('prodName')?.value || 'Project';
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "#,Scene,Shot,Take,Status,CamRoll,SoundRoll,Notes\n";

            logsData.forEach((log, index) => {
                const num = logsData.length - index;
                csvContent += `${num},"${log.scene}","${log.shot}",${log.take},"${log.status}","${log.camRoll}","${log.soundRoll}","${log.notes}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${mode}_report_${prodName}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Render initially
        renderLogs();
    </script>
</body>
</html>
